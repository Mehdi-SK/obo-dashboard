title: "OBO Dashboard"
description: "Dashboard for checking ontology quality. Under construction."
obo_score_weights:
  no_base:
    impact_factor: 5
    max_impact: 5
  overall_error:
    impact_factor: 5
    max_impact: 20
  overall_warning:
    impact_factor: 0.5
    max_impact: 10
  overall_info:
    impact_factor: 0.1
    max_impact: 5
  report_errors:
    impact_factor: 0.05
    max_impact: 10
  report_warning:
    impact_factor: 0.01
    max_impact: 5
  report_info:
    impact_factor: 0.005
    max_impact: 3
  impact:
    impact_factor: 1
    max_impact: 1 
  dashboard:
    impact_factor: 1
    max_impact: 1
ontologies:
  custom:
    - id: idpo
      mirror_from: https://github.com/BioComputingUP/idpo/releases/download/v2025-10-01/idpo.owl
      title: "Intrinsically Disordered Proteins Ontology"
      contact:
        email: ximena.castro@unipd.it
        label: Ximena Aixa Castro Naser
        orcid: 0000-0002-9211-1255
        github: XimeAixa
      description: The Intrinsically Disordered Proteins Ontology (IDPO) defines concepts and relationships for the states, transitions, and functional roles of intrinsically disordered proteins and regions.
      domain: biochemistry
      homepage: https://github.com/BioComputingUP/idpo
      products:
        - id: idpo.owl
      tracker: https://github.com/BioComputingUP/idpo/issues
      license:
        url: https://creativecommons.org/licenses/by/4.0/
        label: CC BY 4.0
    - id: tmp
      mirror_from: "https://raw.githubusercontent.com/monarch-ebi-dev/robot_tests/master/custom-dashboard.owl"
prefer_base: True
profile:
  baseprofile: "https://raw.githubusercontent.com/ontodev/robot/master/robot-core/src/main/resources/report_profile.txt"
  custom:
    - "WARN\tfile:./sparql/missing_xrefs.sparql"
report_truncation_limit: 600
redownload_after_hours: 0
environment:
  ROBOT_JAR: /tools/robot.jar
  ROBOT: robot
